# Local test server: same image and Paper build as production, with datapacks/ender_pet
# mounted live. Edit files in the repo, then /reload in game.
#   MC_USERNAME=YourName docker compose -f dev/docker-compose.yml up
# Connect from Minecraft 26.3 to: localhost:25566
services:
  mc-dev:
    image: itzg/minecraft-server
    container_name: mc-dev
    ports:
      - '127.0.0.1:25566:25565'   # localhost only; nobody else can join
    environment:
      EULA: 'true'
      TYPE: PAPER
      VERSION: '26.3'
      PAPER_BUILD: '227'          # keep in step with production
      OPS: '${MC_USERNAME:-}'
      LEVEL_TYPE: FLAT
      MODE: creative
      DIFFICULTY: easy
      MOTD: 'Ender Pet dev server'
      MAX_MEMORY: 2G
    volumes:
      - './data:/data'
      - '../datapacks/ender_pet:/data/world/datapacks/ender_pet'
      - './devkit:/data/world/datapacks/devkit'
      # Custom Discs built locally (mvn package in plugins/urlcustomdiscs); the image copies /plugins into /data/plugins.
      - '../plugins/urlcustomdiscs/target/URLCustomDiscs-v2.7.2-fork.3.jar:/plugins/URLCustomDiscs.jar:ro'

  # The disc bot (no Discord login): does the downloading/converting and serves the pack, like production.
  # Plugin config.yml for dev: botURL "http://disc-bot:8765" and (the game client is outside the compose network)
  # downloadResourcePackURL "http://localhost:8765/devpacktoken000000000000/discs.zip"; botSecret comes from .disc-secrets.json
  disc-bot:
    build: ../discord-bot
    environment:
      PACK_TOKEN: devpacktoken000000000000
      PORT: '8765'
    ports:
      - '127.0.0.1:8765:8765'
    volumes:
      - './data/plugins/URLCustomDiscs:/data/plugins/URLCustomDiscs'
    cpus: 1.0
    mem_limit: 768m
