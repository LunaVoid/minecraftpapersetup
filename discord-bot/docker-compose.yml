# Coolify app for the disc bot: build pack "Docker Compose", base directory /discord-bot.
# Mounts only the Custom Discs plugin folder of the Minecraft server (ADR 0004). That folder must
# already exist (start the server with the plugin once), or Docker creates it owned by root.
services:
  disc-bot:
    # Coolify runs compose with the repo root as project directory, so paths are relative to the root.
    build: ./discord-bot
    restart: unless-stopped
    environment:
      - 'PACK_TOKEN=${PACK_TOKEN}'
      # Shared with the plugin's config.yml (botSecret); enables /disc create and /disc delete.
      - 'DISC_API_SECRET=${DISC_API_SECRET}'
      - 'MAX_SECONDS=${MAX_SECONDS:-600}'
      # Leave both unset to run without Discord.
      - 'DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}'
      - 'DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-}'
    volumes:
      - '${MC_PLUGIN_DIR:-/data/coolify/services/3hwwvj1at9jcp0sxhgbcbzxn/minecraft-data/plugins/URLCustomDiscs}:/data/plugins/URLCustomDiscs'
    expose:
      - '8080'
    # Shares the host with the game: one disc job at a time, niced, and capped here.
    cpus: 1.0
    mem_limit: 768m
